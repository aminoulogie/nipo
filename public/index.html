<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Music</title>

<!-- PWA / iOS home-screen app metadata -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Music" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />

<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<!-- ===== Login screen ===== -->
<section id="login-screen" class="screen login-screen">
  <div class="login-card">
    <div class="login-logo">♫</div>
    <h1>Music</h1>
    <p class="login-sub">Sign in to your Navidrome server</p>
    <form id="login-form">
      <label>
        <span>Server</span>
        <input id="login-server" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
      </label>
      <label>
        <span>Username</span>
        <input id="login-username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" />
      </label>
      <label>
        <span>Password</span>
        <input id="login-password" type="password" autocomplete="current-password" />
      </label>
      <button type="submit" id="login-btn">Sign In</button>
      <p id="login-error" class="login-error" hidden></p>
    </form>
  </div>
</section>

<!-- ===== App shell ===== -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <div class="topbar-title" id="topbar-title">Home</div>
    <button class="round-btn" id="logout-btn" aria-label="Sign out">⏻</button>
  </header>

  <main id="views" class="views">

    <section id="view-home" class="view">
      <div class="section" id="home-recent"></div>
      <div class="section" id="home-random"></div>
      <div class="section" id="home-frequent"></div>
    </section>

    <section id="view-search" class="view" hidden>
      <div class="search-bar">
        <input id="search-input" type="search" placeholder="Artists, Songs, Lyrics, and More" autocapitalize="off" spellcheck="false" />
      </div>
      <div id="search-results"></div>
    </section>

    <section id="view-library" class="view" hidden>
      <div class="segmented" id="library-tabs">
        <button class="seg-btn active" data-lib="albums">Albums</button>
        <button class="seg-btn" data-lib="artists">Artists</button>
        <button class="seg-btn" data-lib="playlists">Playlists</button>
      </div>
      <div id="library-content"></div>
    </section>

    <section id="view-album" class="view" hidden>
      <div class="detail-head-row">
        <button class="round-btn" data-back aria-label="Back">‹</button>
        <button class="round-btn" aria-label="More">···</button>
      </div>
      <div id="album-detail"></div>
    </section>

    <section id="view-artist" class="view" hidden>
      <div class="detail-head-row">
        <button class="round-btn" data-back aria-label="Back">‹</button>
        <button class="round-btn" aria-label="More">···</button>
      </div>
      <div id="artist-detail"></div>
    </section>

    <section id="view-playlist" class="view" hidden>
      <div class="detail-head-row">
        <button class="round-btn" data-back aria-label="Back">‹</button>
        <button class="round-btn" aria-label="More">···</button>
      </div>
      <div id="playlist-detail"></div>
    </section>

  </main>

  <!-- Mini player -->
  <div id="mini-player" class="mini-player" hidden>
    <img id="mini-cover" class="mini-cover" alt="" />
    <div class="mini-meta">
      <div id="mini-title" class="mini-title"></div>
      <div id="mini-artist" class="mini-artist"></div>
    </div>
    <button class="mini-btn" id="mini-playpause" aria-label="Play or pause">►</button>
    <button class="mini-btn" id="mini-next" aria-label="Next track">►►</button>
  </div>

  <!-- Tab bar -->
  <nav class="tabbar">
    <button class="tab-btn active" data-view="home">
      <span class="tab-icon">⌂</span><span>Home</span>
    </button>
    <button class="tab-btn" data-view="library">
      <span class="tab-icon">▤</span><span>Library</span>
    </button>
    <button class="tab-btn" data-view="search">
      <span class="tab-icon">⌕</span><span>Search</span>
    </button>
  </nav>

  <!-- Full-screen Now Playing sheet -->
  <div id="now-playing" class="now-playing" hidden>
    <div class="np-grabber" id="np-collapse"></div>

    <div class="np-cover-wrap">
      <img id="np-cover" class="np-cover" alt="" />
    </div>

    <div class="np-meta-row">
      <div class="np-meta">
        <div id="np-title" class="np-title"></div>
        <div id="np-artist" class="np-artist"></div>
      </div>
      <div class="np-meta-btns">
        <button class="round-btn" id="np-star" aria-label="Favorite">★</button>
        <button class="round-btn" aria-label="More">···</button>
      </div>
    </div>

    <div class="np-slider np-progress">
      <input id="np-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
      <div class="np-times">
        <span id="np-time-cur">0:00</span>
        <span id="np-time-rem">-0:00</span>
      </div>
    </div>

    <div class="np-controls">
      <button class="np-ctrl-btn" id="np-prev" aria-label="Previous">◄◄</button>
      <button class="np-ctrl-btn np-play" id="np-playpause" aria-label="Play or pause">►</button>
      <button class="np-ctrl-btn" id="np-next" aria-label="Next">►►</button>
    </div>

    <div class="np-volume">
      <span class="vol-icon">🔈</span>
      <div class="np-slider">
        <input id="np-vol" type="range" min="0" max="100" value="100" aria-label="Volume" />
      </div>
      <span class="vol-icon">🔊</span>
    </div>

    <div class="np-bottom">
      <button id="np-shuffle" aria-label="Shuffle">⤨</button>
      <button id="np-repeat" aria-label="Repeat">⟳</button>
      <button id="np-queue-btn" aria-label="Queue">☰</button>
    </div>

    <div class="np-queue" id="np-queue" hidden>
      <div class="np-queue-title">Playing Next</div>
      <div id="np-queue-list"></div>
    </div>
  </div>

</div>

<audio id="audio" preload="metadata"></audio>

<script src="/md5.js"></script>
<script src="/app.js"></script>
</body>
</html>
