<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Music</title>
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Music" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.8 19 12 7.5 19.2Z" fill="currentColor" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.2" width="4.3" height="15.6" rx="1.9" fill="currentColor"/><rect x="13.7" y="4.2" width="4.3" height="15.6" rx="1.9" fill="currentColor"/></symbol>
  <symbol id="i-backward" viewBox="0 0 24 24"><path d="M10.8 6 3.6 12l7.2 6Z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M20.4 6 13.2 12l7.2 6Z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
  <symbol id="i-forward" viewBox="0 0 24 24"><path d="M3.6 6 10.8 12l-7.2 6Z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M13.2 6 20.4 12l-7.2 6Z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.44 6.19 20.5l1.11-6.47L2.6 9.45l6.5-.95z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-ellipsis" viewBox="0 0 24 24"><circle cx="5.2" cy="12" r="1.95" fill="currentColor"/><circle cx="12" cy="12" r="1.95" fill="currentColor"/><circle cx="18.8" cy="12" r="1.95" fill="currentColor"/></symbol>
  <symbol id="i-speaker-low" viewBox="0 0 24 24"><path d="M12 4.6 6.9 9.1H3.4v5.8h3.5L12 19.4Z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-speaker-high" viewBox="0 0 24 24"><path d="M10.5 4.6 5.4 9.1H1.9v5.8h3.5l5.1 4.5Z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14.4 9.1a4.1 4.1 0 0 1 0 5.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M17.3 6.2a8.2 8.2 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M2.6 6.6H6c3 0 4.4 10.8 7.6 10.8h4.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M2.6 17.4H6c1.7 0 2.8-3.4 3.9-6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13.2 6.6h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m16.4 3.7 3 2.9-3 2.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="m16.4 14.5 3 2.9-3 2.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M6.8 6.2h10.4a4.3 4.3 0 0 1 4.3 4.3v.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m17.4 2.9 3.3 3.3-3.3 3.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.2 17.8H6.8a4.3 4.3 0 0 1-4.3-4.3v-.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m6.6 21.1-3.3-3.3 3.3-3.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><circle cx="3.6" cy="6.4" r="1.5" fill="currentColor"/><circle cx="3.6" cy="12" r="1.5" fill="currentColor"/><circle cx="3.6" cy="17.6" r="1.5" fill="currentColor"/><path d="M8.4 6.4h12M8.4 12h12M8.4 17.6h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.2 10.4 12 3.2l8.8 7.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.6 9.2V19a1.6 1.6 0 0 0 1.6 1.6h9.6a1.6 1.6 0 0 0 1.6-1.6V9.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><rect x="2.8" y="2.8" width="18.4" height="18.4" rx="4.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.2 16.4V8.1l6-1.3v8.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="16.4" r="1.9" fill="currentColor"/><circle cx="14.6" cy="15" r="1.9" fill="currentColor"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.6" cy="10.6" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.8 15.8 4.8 4.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.2 13.6 9l6 1.6-6 1.6L12 18.8 10.4 12.4 4.4 10.8l6-1.6z" fill="currentColor"/></symbol>
  <symbol id="i-radio" viewBox="0 0 24 24"><circle cx="12" cy="14" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.2 9.2a6.8 6.8 0 0 1 9.6 0M4.6 6.4a10.4 10.4 0 0 1 14.8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 17.2V20.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 3.8 6.8 12 15 20.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 3.8 17.2 12 9 20.2" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 2.8v8.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M18 6.3a8.4 8.4 0 1 1-12 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5.4l10-2.1V16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.6" cy="18" r="2.7" fill="currentColor"/><circle cx="16.6" cy="16" r="2.7" fill="currentColor"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M6.8 17.2h10.6A3.7 3.7 0 0 0 21 13.6c0-1.85-1.4-3.4-3.2-3.65A5.05 5.05 0 0 0 8.1 7.6 4.05 4.05 0 0 0 4 11.5c0 2.1 1.6 3.85 3.7 4.05" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10.2v6.2M9.4 14.2 12 16.8l2.6-2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-downloaded" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8.2 12.2 2.6 2.6 5.2-5.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-list-plus" viewBox="0 0 24 24"><path d="M4 7h11M4 12h8M4 17h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17 14v6M14 17h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</defs></svg>
<section id="login-screen" class="screen login-screen"><div class="login-card"><svg class="ic login-logo"><use href="#i-note"></use></svg><h1>Music</h1><p class="login-sub">Sign in to your Navidrome server</p><form id="login-form"><label><span>Server</span><input id="login-server" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" /></label><label><span>Username</span><input id="login-username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" /></label><label><span>Password</span><input id="login-password" type="password" autocomplete="current-password" /></label><button type="submit" id="login-btn">Sign In</button><p id="login-error" class="login-error" hidden></p></form></div></section>
<div id="app" class="app" hidden>
<header class="topbar"><div class="topbar-title" id="topbar-title">Home</div><div class="topbar-actions"><button class="round-btn glass" id="create-playlist-btn" aria-label="New playlist"><svg class="ic"><use href="#i-plus"></use></svg></button><button class="round-btn glass" id="logout-btn" aria-label="Sign out"><svg class="ic"><use href="#i-power"></use></svg></button></div></header>
<main id="views" class="views">
<section id="view-home" class="view"><div class="section" id="home-recent"></div><div class="section" id="home-random"></div><div class="section" id="home-frequent"></div></section>
<section id="view-new" class="view" hidden><div id="new-content"></div></section>
<section id="view-radio" class="view" hidden><div id="radio-content"></div></section>
<section id="view-search" class="view" hidden><div class="search-bar"><input id="search-input" type="search" placeholder="Artists, Songs, Albums" autocapitalize="off" spellcheck="false" /></div><div id="search-results"></div></section>
<section id="view-library" class="view" hidden><div class="segmented" id="library-tabs"><button class="seg-btn active" data-lib="playlists">Playlists</button><button class="seg-btn" data-lib="albums">Albums</button><button class="seg-btn" data-lib="artists">Artists</button><button class="seg-btn" data-lib="downloaded">Downloaded</button></div><div id="library-content"></div></section>
<section id="view-album" class="view" hidden><div class="detail-head-row"><button class="round-btn glass" data-back aria-label="Back"><svg class="ic"><use href="#i-chevron-left"></use></svg></button><button class="round-btn glass" aria-label="More"><svg class="ic"><use href="#i-ellipsis"></use></svg></button></div><div id="album-detail"></div></section>
<section id="view-artist" class="view" hidden><div class="detail-head-row"><button class="round-btn glass" data-back aria-label="Back"><svg class="ic"><use href="#i-chevron-left"></use></svg></button><button class="round-btn glass" aria-label="More"><svg class="ic"><use href="#i-ellipsis"></use></svg></button></div><div id="artist-detail"></div></section>
<section id="view-playlist" class="view" hidden><div class="detail-head-row"><button class="round-btn glass" data-back aria-label="Back"><svg class="ic"><use href="#i-chevron-left"></use></svg></button><button class="round-btn glass" aria-label="More"><svg class="ic"><use href="#i-ellipsis"></use></svg></button></div><div id="playlist-detail"></div></section>
</main>
<div id="mini-player" class="mini-player glass" hidden><img id="mini-cover" class="mini-cover" alt="" /><div class="mini-meta"><div id="mini-title" class="mini-title"></div><div id="mini-artist" class="mini-artist"></div></div><button class="mini-btn" id="mini-playpause" aria-label="Play or pause"><svg class="ic"><use href="#i-play"></use></svg></button><button class="mini-btn" id="mini-next" aria-label="Next track"><svg class="ic"><use href="#i-forward"></use></svg></button></div>
<div class="chrome-dock">
<nav class="tabbar glass" id="tabbar"><div class="tab-pill" id="tab-pill"></div><button class="tab-btn active" data-view="home"><svg class="ic tab-icon"><use href="#i-home"></use></svg><span>Home</span></button><button class="tab-btn" data-view="radio"><svg class="ic tab-icon"><use href="#i-radio"></use></svg><span>Radio</span></button><button class="tab-btn" data-view="library"><svg class="ic tab-icon"><use href="#i-library"></use></svg><span>Library</span></button></nav>
<button class="search-fab glass" id="search-fab" data-view="search" aria-label="Search"><svg class="ic tab-icon"><use href="#i-search"></use></svg></button>
</div>
<div id="now-playing" class="now-playing" hidden><div class="np-grabber" id="np-collapse"></div><div class="np-cover-wrap"><img id="np-cover" class="np-cover" alt="" /></div><div class="np-meta-row"><div class="np-meta"><div id="np-title" class="np-title"></div><div id="np-artist" class="np-artist"></div></div><div class="np-meta-btns"><button class="round-btn glass" id="np-star" aria-label="Favourite"><svg class="ic"><use href="#i-star"></use></svg></button><button class="round-btn glass" id="np-keep" aria-label="Keep offline"><svg class="ic"><use href="#i-download"></use></svg></button><button class="round-btn glass" id="np-more" aria-label="More"><svg class="ic"><use href="#i-ellipsis"></use></svg></button></div></div><div class="np-slider np-progress" id="np-progress"><input id="np-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" /><div class="np-times"><span id="np-time-cur">0:00</span><span id="np-time-rem">-0:00</span></div></div><div class="np-controls"><button class="np-ctrl-btn" id="np-prev" aria-label="Previous"><svg class="ic"><use href="#i-backward"></use></svg></button><button class="np-ctrl-btn np-play" id="np-playpause" aria-label="Play or pause"><svg class="ic"><use href="#i-play"></use></svg></button><button class="np-ctrl-btn" id="np-next" aria-label="Next"><svg class="ic"><use href="#i-forward"></use></svg></button></div><div class="np-volume"><svg class="ic vol-icon"><use href="#i-speaker-low"></use></svg><div class="np-slider" id="np-vol-wrap"><input id="np-vol" type="range" min="0" max="100" value="100" aria-label="Volume" /></div><svg class="ic vol-icon"><use href="#i-speaker-high"></use></svg></div><div class="np-bottom"><button id="np-shuffle" aria-label="Shuffle"><svg class="ic"><use href="#i-shuffle"></use></svg></button><button id="np-repeat" aria-label="Repeat"><svg class="ic"><use href="#i-repeat"></use></svg></button><button id="np-queue-btn" aria-label="Queue"><svg class="ic"><use href="#i-queue"></use></svg></button></div><div class="np-queue glass" id="np-queue" hidden><div class="np-queue-title">Playing Next</div><div id="np-queue-list"></div></div></div>
</div>
<div id="sheet-overlay" class="sheet-overlay" hidden></div>
<div id="action-sheet" class="action-sheet glass" hidden><div class="sheet-handle"></div><div id="action-sheet-body"></div></div>
<div id="create-sheet" class="create-sheet glass" hidden><h3>New Playlist</h3><input id="create-name" type="text" placeholder="Playlist name" maxlength="80" /><div class="create-actions"><button class="ghost" id="create-cancel" type="button">Cancel</button><button class="primary" id="create-confirm" type="button">Create</button></div></div>
<audio id="audio" preload="metadata"></audio>
<script src="/md5.js"></script>
<script src="/app.js"></script>
<script src="/extras.js"></script>
</body>
</html>
